# # 彻底替换掉原来的 DWA 内容
# base_local_planner: "teb_local_planner/TebLocalPlannerROS"

# TebLocalPlannerROS:
#   odom_topic: Odometry  # 您的 DWA 也在用这个, 保持一致
#   map_frame: map # 确保TEB知道地图坐标系

#   # =================
#   # 关键：阿克曼运动学参数
#   # =================
#   kinematics:
#     is_ackermann: true       # 必须！告诉 TEB 这是阿克曼模型
#     min_turning_radius: 1.0  # [m] 必须！【请测量并填写您小车的实际最小转弯半径】
#     ackermann_wheelbase: 0.3 # [m] 建议！【请测量并填写您小车的实际轴距】
#     cmd_angle_instead_of_vel: false # 如果您的底盘接收 /cmd_vel (Twist消息)，则设为 false

#   # =================
#   # 速度和加速度 (请根据您的底盘调整)
#   # =================
#   max_vel_x: 3          #
#   max_vel_x_backwards: 1.5   # 允许的倒车速度
#   max_vel_theta: 1.5         # 允许的最大转向角速度 (不是原地旋转)
#   acc_lim_x: 1             #
#   acc_lim_theta: 0.8         #

#   # =================
#   # 目标公差 (可以沿用 DWA 的设置)
#   # =================
#   xy_goal_tolerance: 0.2     #
#   yaw_goal_tolerance: 6.28    #
#   free_goal_vel: false       # 推荐

#   # =================
#   # 障碍物
#   # =================
#   min_obstacle_dist: 0.35    # 机器人与障碍物保持的最小距离
#   include_costmap_obstacles: true
#   costmap_obstacles_behind_robot_dist: 1.0
#   obstacle_poses_affected: 30
#   inflation_dist: 0.3        # 膨胀半径

#   # =================
#   # 轨迹和优化
#   # =================
#   teb_autosize: True
#   dt_ref: 0.3
#   dt_hysteresis: 0.1
#   global_plan_overwrite_orientation: True
#   max_global_plan_lookahead_dist: 3.0
#   feasibility_check_no_poses: 5
base_local_planner: "teb_local_planner/TebLocalPlannerROS"

TebLocalPlannerROS:
  odom_topic: Odometry
  map_frame: map

  # ==========================================================
  # 机器人模型设置（已修复报错）：必须显式写出顶点
  # ==========================================================
  footprint_model: 
    type: "polygon"
    vertices: [[-0.22, -0.18], [-0.22, 0.18], [0.22, 0.18], [0.22, -0.18]]

  # 阿克曼运动学参数。ROS1 teb_local_planner 读取顶层参数，不读取 kinematics 子命名空间。
  min_turning_radius: 1.0
  wheelbase: 0.3
  cmd_angle_instead_rotvel: false

  # 速度和加速度设置
  max_vel_x: 3.0
  max_vel_y: 0.0
  max_vel_x_backwards: 1.5
  max_vel_theta: 1.5
  acc_lim_x: 1.0
  acc_lim_y: 0.0
  acc_lim_theta: 0.8

  # 目标公差
  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.1 
  free_goal_vel: false

  # 障碍物避障
  min_obstacle_dist: 0.3 
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 30
  inflation_dist: 0.4 

  # 轨迹和优化
  teb_autosize: True
  dt_ref: 0.3
  dt_hysteresis: 0.1
  global_plan_overwrite_orientation: False
  max_global_plan_lookahead_dist: 3.0
  feasibility_check_no_poses: 5

  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: True
  optimization_verbose: False
  penalty_epsilon: 0.1
  weight_max_vel_x: 2
  weight_max_vel_theta: 1
  weight_acc_lim_x: 1
  weight_acc_lim_theta: 1
  weight_kinematics_nh: 1000
  weight_kinematics_forward_drive: 20
  weight_kinematics_turning_radius: 20
  weight_optimaltime: 1
  weight_shortest_path: 0
  weight_obstacle: 100
  weight_inflation: 0.2
  weight_viapoint: 1

  enable_homotopy_class_planning: False
  oscillation_recovery: False
