# ==========================================
# 1. Robot geometry and map ingestion
# 论文对应：
# - 3.1 系统总体框架
# - 3.5.1 静态地图与实时感知环境的基础表示
# 说明：
# - 本组主要是几何模型、地图等待与基础输入话题，不属于方法创新参数。
# ==========================================
footprint: [0.20, 0.25, 0.20, -0.25, -0.10, -0.25, -0.10, -0.09, -0.30, -0.09, -0.30, 0.09, -0.10, 0.09, -0.10, 0.25]
inscribed_radius: 0.10 # 内切圆半径

startup_wait_for_map: true
startup_map_wait_timeout: 0.0
startup_map_wait_poll: 1.0

meshTopic: "/isweep_planner/mesh"
edgeTopic: "/isweep_planner/mesh_edges"
vertexTopic: "/isweep_planner/mesh_vertices"
inputdata: "meshes/robot_t_shape.obj" # 用于高精度 SVSDF 碰撞评估的机器人网格模型

# ==========================================
# 2. Compute budget and space discretization
# 论文对应：
# - 3.2 风险分段的全局路径生成方法
# 说明：
# - 这一组决定地图离散精度、碰撞查询分辨率和前端搜索代价。
# - 属于“算法运行条件”，不是论文主创新，但会影响实验时间和轨迹质量。
# ==========================================
threads_num: 8                # 【结算时间】多线程并行数量，越高处理并行段或评估时耗时越短。
occupancy_resolution: 0.10    # 【结算精度/时间】地图栅格化分辨率。越小精度越高，但 ESDF 更新和搜索时间呈平方/立方级增长。
debug_output: false
sta_threshold: 1
colli_thres: 0.05             # 碰撞安全阈值

kernel_size: 7                # 【结算时间/精度】离散碰撞检测的核大小。变大增加耗时但覆盖更完整。
kernel_yaw_num: 18            # 【结算时间/精度】朝向角 (Yaw) 离散化数量 (360/18=20度)。越大朝向判断越精细，但预计算与查询耗时直线上升。
front_end_safeh: 0.05         # 前端拓扑搜索时的安全膨胀余量

# ==========================================
# 3. Dynamic model and physical limits
# 论文对应：
# - 3.2.3 差异化轨迹求解
# - 3.4.4 控制输出
# 说明：
# - 约束轨迹优化和局部速度输出的物理上限。
# ==========================================
vehicleMass: 0.61
gravAcc: 9.8
horizDrag: 0.10
vertDrag: 0.10
parasDrag: 0.01
speedEps: 0.0001
vmax: 1.2
omgmax: 2.5
thetamax: 6.0

# ==========================================
# 4. Shared optimizer tolerances and weights
# 论文对应：
# - 3.2.3 高低风险段的差异化轨迹求解
# 说明：
# - 这部分是后端优化器的公共参数。
# - 与论文主线最相关的是：同一套求解框架在不同风险段上采用不同求解策略。
# ==========================================
smoothingEps: 1.0e-2          # 【结算时间/精度】平滑容差，决定优化退出条件。越小轨迹越平滑(精度高)，但迭代次数增多(耗时长)。
integralIntervs: 10           # 【结算精度/时间】轨迹积分评估间隔数。越大对连续碰撞/动力学评估越精细，但求值计算量显著增加。
relCostTol: 1.0e-8            # 【结算时间/精度】目标函数相对代价容差(优化收敛条件)。越小收敛越极致(耗时大)。
relCostTolMidEnd: 1.0e-8      
eps: 0.08
inittime: 0.9
mem_size: 16                  # 【结算时间】LMBM/L-BFGS 拟牛顿法保存的历史步数。一般在 8~32 间，影响收敛速度。
past: 64                      # 过去代价历史长度，用于提前终止评估
min_step: 1.0e-32
g_epsilon: 0.0

# 优化权重配置 (改变轨迹形态倾向，间接影响到达极值的路径)
weight_v: 10.0
weight_a: 20.0
weight_p: 150.0               # 位置偏离惩罚权重
weight_pr: 8.0
weight_ar: 0.0
weight_omg: 6.0
weight_theta: 6.0
rho_mid_end: 1.0
rho: 2.0
safety_hor: 0.08

# ==========================================
# 5. Stage-specific algorithm parameters
# 说明：
# - 从这里开始，按论文主线对应模块分组。
# ==========================================
topology:
  num_samples: 15000          # 【结算时间/精度】PRM前端拓扑采样点数。点数越多，在复杂迷宫中找到解(且是最优解)概率越高，但建图极慢。
  knn: 10                     # 拓扑图连接邻居数。越大路径越平滑，建图耗时越长。
  max_paths: 2                # 探索候选路径的数量上限。
  safe_distance: 0.25          # 与原版 iSweep 对齐，避免全局拓扑路径过度贴墙。

# 论文对应 3.2.2 路径离散化与风险段判定
# 作用：
# - 控制拓扑路径离散成 SE(2) 状态序列的密度。
# - 该序列随后被打上风险标签并组织为 MotionSegment。
se2:
  discretization_step: 0.15   # 【结算精度/时间】将拓扑路径切分为SE(2)状态的步长。越小则分段越密集，后端优化自由度越高(越贴合)，但优化变量猛增导致大幅降速。
  max_push_attempts: 5        # 推离障碍物最大尝试次数。

# 论文对应 3.2.3 高低风险段的差异化轨迹求解
optimizer:
  max_iterations: 100         # 【结算时间】优化器最大迭代次数。硬性卡住最大结算时间，防止陷入死循环。
  lambda_smooth: 1.0          # 平滑惩罚
  lambda_time: 1.0            # 时间代价惩罚
  lambda_safety: 10.0         # 避障惩罚 (越高越安全，但容易引起剧烈转向)
  lambda_dynamics: 1.0        
  lambda_pos_residual: 5.0    
  lambda_yaw_residual: 2.0
  max_vel: 1.5
  max_acc: 2.0
  max_yaw_rate: 1.0
  safety_margin: 0.05
  step_size: 0.01             # 【结算时间】优化梯度步长

# 论文对应 3.2.4 轨迹失败时的局部恢复与回退机制
hybrid_astar:                 # (作为Fallback回退时触发，极其耗时)
  step_size: 0.01             # 【结算时间】搜索步长，越小搜索树规模呈指数级爆炸。
  wheel_base: 0.5
  max_steer: 0.6
  steer_samples: 5            # 【结算时间/精度】单步展开的方向盘采样数(分支因子)。越大转向越自然，但搜时间极速增加。
  goal_tolerance_pos: 0.35
  goal_tolerance_yaw: 0.4
  reverse_penalty: 2.0
  steer_penalty: 0.2
  steer_change_penalty: 0.2
  switch_penalty: 2.0
  max_expansions: 50000       # 【结算时间】全量搜索最大展开节点数。直接限制极端情况下的卡死时间。
  fast_pass_max_expansions: 8000
  fast_pass_steer_samples: 3
  pose_recovery_max_radius: 0.6
  pose_recovery_radial_step: 0.05
  pose_recovery_angular_samples: 24

# 论文对应 3.3 风险参考轨迹构建方法
# 字段说明：
# - sample_dt 控制风险参考轨迹的采样密度。
# - min/max_preferred_speed 控制不同风险等级映射出的建议速度范围。
reference:
  sample_dt: 0.15
  min_preferred_speed: 0.18
  max_preferred_speed: 0.85

# 论文对应 3.4 局部风险自适应跟踪与重规划机制
# 其中最关键的方法参数包括：
# - high_risk_ratio_threshold: 局部窗口切换到严格模式的阈值
# - high_risk_lateral_replan_threshold / high_risk_yaw_replan_threshold:
#   高风险窗口下的重规划触发阈值
# - strict_reference_deviation_threshold:
#   严格模式下局部轨迹相对全局风险参考的最大允许偏离
# 其余参数主要用于工程稳定性和局部避碰恢复。
local_planner:
  update_rate: 10.0
  use_local_obstacle_map: false
  local_obstacle_map_topic: "/isweep_planner/local_obstacle_map"
  window_length: 3.5
  window_resample_spacing: 0.25
  high_risk_ratio_threshold: 0.5 #0.35
  low_risk_smoothing_alpha: 0.35
  high_risk_lateral_replan_threshold: 0.5 #0.35
  high_risk_yaw_replan_threshold: 0.7  #0.45
  strict_reference_deviation_threshold: 0.60 #0.4
  low_risk_clearance_margin: 0.08
  high_risk_clearance_margin: 0.06
  clearance_target_cap: 0.35      # 局部校验的最大 clearance 目标，避免空旷区因参考 clearance 过大反复重规划
  push_step_size: 0.05
  max_linear_speed: 0.65
  max_angular_speed: 0.60
  max_linear_accel: 1.5
  max_angular_accel: 0.8
  min_turn_linear_speed: 0.16
  min_turning_radius: 0.90       # 阿克曼曲率约束：|curvature| <= 1 / min_turning_radius
  angular_gain: 0.6  #0.9
  sharp_turn_yaw_error: 0.85
  full_speed_yaw_error: 0.28
  pure_pursuit_lookahead: 1.20
  pure_pursuit_lateral_deadband: 0.03
  angular_deadband: 0.03
  command_smoothing_alpha: 0.35
  dynamic_obstacle_relevance_radius: 0.65
  push_max_iters: 8
  consecutive_failure_limit: 30
  blocked_window_limit: 30
  horizon_time: 2.5              # 局部采样规划前向仿真时域
  simulation_dt: 0.10
  control_period: 0.10
  velocity_samples: 5
  curvature_samples: 7
  target_curvature_samples: 4
  allow_reverse: false           # 默认只前进；如底盘支持倒车，可改为 true
  goal_reached_xy_tolerance: 0.25
  goal_reached_yaw_tolerance: 0.35
  low_risk_reference_weight: 2.0
  high_risk_reference_weight: 8.0
  yaw_weight: 0.4
  obstacle_weight: 3.0
  progress_weight: 2.5
  speed_weight: 0.8
  curvature_weight: 0.7
  acceleration_weight: 0.8
  angular_acceleration_weight: 1.5

start_pose:
  x: 3.16
  y: 45.92
  yaw: -1.98
goal_pose:
  x: 5.01
  y: 11.73
  yaw: -0.14
